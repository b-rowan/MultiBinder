[project]
name = "multibinder"
version = "0.1.0"
description = "MTG Collection and Deck Tracker"
authors = [
    {name = "Brett Rowan",email = "121075405+b-rowan@users.noreply.github.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "tortoise-orm[asyncpg]>=0.21.0",
    "aiosqlite>=0.20.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.0",
    "pydantic-settings>=2.0.0",
    "aerich>=0.7.2",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.aerich]
tortoise_orm = "app.database.AERICH_TORTOISE_ORM"
location = "./migrations"
src_folder = "./app"